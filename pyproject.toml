[project]
name = "stagiaires-rag"
version = "0.1.0"
description = "Assistant RAG qui rédige des brouillons de réponse aux e-mails des stagiaires, validés par l'encadrant"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
llm = ["anthropic>=0.40"]
dev = ["pytest>=8"]

[project.scripts]
stagiaires-rag = "stagiaires_rag.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
